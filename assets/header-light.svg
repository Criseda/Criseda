    .b { fill: #82356E; transform-box: fill-box; transform-origin: bottom; animation-name: eq; animation-iteration-count: infinite; animation-direction: alternate; animation-timing-function: ease-in-out; }
    @keyframes eq { from { transform: scaleY(var(--lo)); } to { transform: scaleY(1); } }
